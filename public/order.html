<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>შეკვეთის გაკეთება — მშენსერვისი</title>
    <meta
      name="description"
      content="შეავსეთ ფორმა და მიიღეთ სამშენებლო-სარემონტო მომსახურების უფასო კონსულტაცია და ხარჯთაღრიცხვა."
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/order.css" />
    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
  </head>
  <body data-page="order">
    <section class="section" style="padding-top: 24px">
      <div class="container">
        <span class="eyebrow"
          ><i data-lucide="clipboard-check" class="ic"></i>ოპერატიული
          რეაგირება</span
        >
        <h1 class="section-title">იმოქმედეთ დროულად</h1>

        <!-- სწრაფი კონტაქტი -->
        <div class="grid grid-2" style="margin-top: 16px">
          <a href="#" id="callNowBtn" class="card quick-contact">
            <div class="quick-icon">
              <i data-lucide="phone-call" class="ic-lg"></i>
            </div>
            <div>
              <strong>დაგვიკავშირდით ახლავე</strong>
              <span id="quickPhone" class="section-sub"></span>
            </div>
            <i data-lucide="chevron-right" class="ic"></i>
          </a>
          <a
            href="#"
            id="waBtn"
            target="_blank"
            rel="noopener"
            class="card quick-contact"
          >
            <div class="quick-icon wa">
              <i data-lucide="message-circle" class="ic-lg"></i>
            </div>
            <div>
              <strong>WhatsApp ჩატი</strong>
              <span class="section-sub">დაგვიკავშირდით WhatsApp-ზე</span>
            </div>
            <i data-lucide="chevron-right" class="ic"></i>
          </a>
        </div>
      </div>
    </section>

    <script src="/js/layout.js" defer></script>
    <script src="/js/order.js" defer></script>
  </body>
</html>
